<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldShield2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="shieldBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162e4e" />
      <stop offset="100%" stop-color="#071220" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Escudo Hexagonal Base -->
  <polygon points="60,6 110,22 110,76 60,114 10,76 10,22" 
           fill="url(#shieldBg2)" 
           stroke="url(#goldShield2)" 
           stroke-width="3" 
           stroke-linejoin="round"
           filter="url(#shadow2)"/>

  <!-- Doble contorno de precisión -->
  <polygon points="60,14 102,28 102,72 60,105 18,72 18,28" 
           fill="none" 
           stroke="rgba(245, 158, 11, 0.3)" 
           stroke-width="1.5" 
           stroke-linejoin="round"/>

  <!-- Corona / Punto Superior de Auditoría -->
  <circle cx="60" cy="24" r="3.5" fill="#fef08a"/>

  <!-- Letras D C en Escudo: 100% Legibles -->
  <text x="60" y="74" 
        font-family="'Montserrat', 'Outfit', 'Inter', 'Segoe UI', Arial, sans-serif" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="2" 
        fill="url(#goldShield2)" 
        text-anchor="middle">DC</text>
</svg>
