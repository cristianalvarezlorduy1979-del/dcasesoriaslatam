<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldText1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgBox1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12243d" />
      <stop offset="100%" stop-color="#07111e" />
    </linearGradient>
    <linearGradient id="borderGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Contenedor Cuadrado Redondeado Ejecutivo -->
  <rect x="8" y="8" width="104" height="104" rx="22" fill="url(#bgBox1)" stroke="url(#borderGold1)" stroke-width="2.5" filter="url(#shadow1)"/>
  <rect x="14" y="14" width="92" height="92" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>

  <!-- Letras D C 100% Claras y Legibles -->
  <text x="60" y="73" 
        font-family="'Montserrat', 'Outfit', 'Inter', 'Segoe UI', Arial, sans-serif" 
        font-weight="900" 
        font-size="46" 
        letter-spacing="3" 
        fill="url(#goldText1)" 
        text-anchor="middle">DC</text>

  <!-- Barra de Acento Dorado de Prestigio -->
  <rect x="36" y="84" width="48" height="3" rx="1.5" fill="url(#goldText1)"/>
</svg>
