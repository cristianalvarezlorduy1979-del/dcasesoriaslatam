<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCircle3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="circleBg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#152b48" />
      <stop offset="85%" stop-color="#060f1c" />
    </radialGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Círculo Base Premium -->
  <circle cx="60" cy="60" r="52" fill="url(#circleBg3)" stroke="url(#goldCircle3)" stroke-width="3" filter="url(#shadow3)"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Letra D -->
  <text x="44" y="73" 
        font-family="'Montserrat', 'Outfit', 'Inter', 'Segoe UI', Arial, sans-serif" 
        font-weight="900" 
        font-size="44" 
        fill="#fde047" 
        text-anchor="middle">D</text>

  <!-- Separador Central Ejecutivo -->
  <line x1="60" y1="36" x2="60" y2="82" stroke="url(#goldCircle3)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Letra C -->
  <text x="76" y="73" 
        font-family="'Montserrat', 'Outfit', 'Inter', 'Segoe UI', Arial, sans-serif" 
        font-weight="900" 
        font-size="44" 
        fill="#f59e0b" 
        text-anchor="middle">C</text>
</svg>
