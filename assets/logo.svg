<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="shieldBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111d33" />
      <stop offset="100%" stop-color="#070d18" />
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Escudo Diamante Hexagonal de Precisión & Blindaje -->
  <polygon points="60,8 106,34 106,86 60,112 14,86 14,34" 
           fill="url(#shieldBgGrad)" 
           stroke="url(#shieldGoldGrad)" 
           stroke-width="3" 
           stroke-linejoin="round"
           filter="url(#shieldShadow)"/>

  <!-- Línea interior de precisión técnica -->
  <polygon points="60,17 98,39 98,81 60,103 22,81 22,39" 
           fill="none" 
           stroke="rgba(245, 158, 11, 0.4)" 
           stroke-width="1.2" 
           stroke-linejoin="round"/>

  <!-- Punto diamante superior de auditoría -->
  <circle cx="60" cy="23" r="2.8" fill="#fde047"/>

  <!-- Iniciales DC con tipografía sólida ejecutiva -->
  <text x="60" y="74" 
        font-family="'Montserrat', 'Outfit', 'Inter', 'Segoe UI', Arial, sans-serif" 
        font-weight="900" 
        font-size="45" 
        letter-spacing="2" 
        fill="url(#shieldGoldGrad)" 
        text-anchor="middle">DC</text>
</svg>
