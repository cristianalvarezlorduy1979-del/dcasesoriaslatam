<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldPlate4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Placa Sólida de Oro Puro -->
  <rect x="8" y="8" width="104" height="104" rx="24" fill="url(#goldPlate4)" stroke="#fff" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shadow4)"/>
  <rect x="13" y="13" width="94" height="94" rx="19" fill="none" stroke="#0b192c" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Letras DC en Azul Marino Profundo (Máximo Contraste y Legibilidad Inmediata) -->
  <text x="60" y="76" 
        font-family="'Montserrat', 'Outfit', 'Inter', 'Segoe UI', Arial, sans-serif" 
        font-weight="900" 
        font-size="52" 
        letter-spacing="2" 
        fill="#0b192c" 
        text-anchor="middle">DC</text>

  <!-- Puntos de Remache / Precisión en las 4 esquinas -->
  <circle cx="20" cy="20" r="2.5" fill="#0b192c" opacity="0.3"/>
  <circle cx="100" cy="20" r="2.5" fill="#0b192c" opacity="0.3"/>
  <circle cx="20" cy="100" r="2.5" fill="#0b192c" opacity="0.3"/>
  <circle cx="100" cy="100" r="2.5" fill="#0b192c" opacity="0.3"/>
</svg>
